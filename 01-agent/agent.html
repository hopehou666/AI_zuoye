<body>
  <div class="wrap">
    <a class="home-link" href="../index.html">← 返回导航</a>
    <div class="brand"><i></i>分数除法习题 学伴智能体</div>
    <span class="tag">六年级数学 · 分数除法</span>
    <p class="desc">可以问分数除法知识点，也可以输入题目和学生答案。不会弹出登录窗口。能连上免费接口就用大模型，连不上就本地批改。</p>

    <section class="panel">
      <div class="chat" id="chat"></div>
      <div class="chips">
        <button type="button" class="chip" data-q="分数除以整数怎么算？">问：分数除以整数怎么算？</button>
        <button type="button" class="chip" data-q="4/7 ÷ 3，我写 12/7">批改：4/7 ÷ 3，我写 12/7</button>
        <button type="button" class="chip" data-q="3/4 ÷ 1/2，我写 3/2">批改：3/4 ÷ 1/2，我写 3/2</button>
      </div>
      <p class="desc" id="llmStatus" style="margin:10px 0 0;">不用注册、不用登录。发送后先试免费接口，失败就本地批改。</p>
      <div class="composer">
        <input id="talk" type="text" placeholder="问知识点，或输入题目和你的答案" />

    <details class="prompt">
      <summary>系统提示词（交作业用）</summary>
      <pre id="promptText"></pre>
    </details>
  </div>

  <script>
    const SYSTEM_PROMPT = `你是「分数除法习题 学伴智能体」，只服务六年级数学里的一个知识点：分数除法。

学生可以做两件事：
1. 问知识点：你用六年级能听懂的话讲解。
2. 输入题目和学生答案：你帮批改，写出正确答案，判断对错，并分析掌握程度。

年级、学科已经固定为六年级数学，不必再问。

## 一、问知识点时怎么答
学生问「什么是倒数」「分数除以整数怎么算」「为什么要乘倒数」「整数除以分数怎么做」等：
- 先写知识点名称，例如：分数除法（分数÷整数）。
- 再用 3～6 句把方法讲清楚，配 1 个小例子和完整计算过程。
- 最后问一句：要不要出一道题练一练，或把你的题目和答案发给我批改？

必须先讲清算理，再讲算法：
除以一个数，等于乘它的倒数。为什么？因为「÷几」就是「平均分成几份」，也就是求它的几分之一。
- 分数÷整数：4/7 ÷ 3 表示把 4/7 平均分成 3 份。平均分成 3 份就是求 4/7 的 1/3，所以 = 4/7 × 1/3 = 4/21。乘 3 是扩大，不是平均分。
- 整数÷分数：3 ÷ 3/4 表示 3 里面有几个 3/4。1 里面有 4/3 个 3/4，所以 3 里面有 3 × 4/3 = 4 个。
- 分数÷分数：3/4 ÷ 1/2 表示 3/4 里面有几个 1/2。除以 1/2 就是乘 2，所以 = 3/4 × 2 = 3/2。

## 二、输入题目帮批改时怎么答
先自己把题算对，再按固定结构输出：题目、学生答案、正确答案、判断、知识点、算理、掌握程度、掌握分析、计算过程、订正引导、巩固一下。算理必须结合本题数字讲「为什么这样算」。

## 三、风格
像六年级数学老师：鼓励、短句、把话说明白。问知识点时不套批改模板。批改时必须出现正确答案和判断。`;

    const BANK = [
      { key: "3/5 ÷ 2/5", guide: ["找到除数 2/5。", "改成乘 5/2。", "约分得最简分数。"], drills: ["3/4 ÷ 1/2", "5/6 ÷ 2/3"] },
      { key: "3/4 ÷ 1/2", guide: ["1/2 的倒数是 2。", "3/4 × 2/1。", "约分成 3/2。"], drills: ["2/3 ÷ 1/4", "5/8 ÷ 1/2"] },
      { key: "1 ÷ 2/5", guide: ["2/5 的倒数是 5/2。", "1 × 5/2。", "结果是 5/2。"], drills: ["1 ÷ 3/4", "1 ÷ 1/8"] },
      { key: "2/3 ÷ 4", guide: ["4 的倒数是 1/4。", "2/3 × 1/4。", "约分成 1/6。"], drills: ["3/5 ÷ 3", "5/6 ÷ 5"] },
      { key: "4/7 ÷ 3", guide: ["3 的倒数是 1/3。", "4/7 × 1/3。", "得到 4/21。"], drills: ["2/5 ÷ 3", "5/8 ÷ 4"] },
      { key: "5/6 ÷ 2/3", guide: ["2/3 的倒数是 3/2。", "5/6 × 3/2，6 和 3 先约分。", "得到 5/4。"], drills: ["4/9 ÷ 2/3", "7/8 ÷ 7/12"] },
      { key: "3 ÷ 3/4", guide: ["3/4 的倒数是 4/3。", "3 × 4/3。", "约分成 4。"], drills: ["2 ÷ 1/5", "6 ÷ 2/3"] }
    ];

    const HELLO = "你好！我是「分数除法习题 学伴智能体」，只练六年级数学的分数除法。\n\n你可以：\n1. 问知识点，比如：分数除以整数怎么算？\n2. 把题目和你的答案发给我，我帮你批改。\n\n例如：4/7 ÷ 3，我写 12/7";

    document.getElementById("promptText").textContent = SYSTEM_PROMPT;

    const chatEl = document.getElementById("chat");
    const talkEl = document.getElementById("talk");
    const statusEl = document.getElementById("llmStatus");
    const pending = { left: "", right: "" };
    const history = [];
    let busy = false;

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) { const t = a % b; a = b; b = t; }
      return a || 1;
    }
    function simp(n, d) {
      if (!d) return "";
      const g = gcd(n, d);
      n /= g; d /= g;
      if (d < 0) { n = -n; d = -d; }
      return d === 1 ? String(n) : n + "/" + d;
    }
    function parseFrac(s) {
      const raw = String(s || "").replace(/\s+/g, "");
      const m = raw.match(/^(-?\d+)(?:\/(-?\d+))?$/);
      if (!m) return null;
      return { n: +m[1], d: m[2] ? +m[2] : 1 };
    }
    function showFrac(f) { return f ? simp(f.n, f.d) : ""; }
    function sameFrac(a, b) { return !!(a && b && a.d && b.d && a.n * b.d === b.n * a.d); }

    function describeKp(left, right) {
      if (left.d !== 1 && right.d === 1) {
        return { name: "分数除法（分数÷整数）", text: "本题练的是「分数除以整数」。问的是：把这个分数平均分成几份，每一份是多少。" };
      }
      if (left.d === 1 && right.d !== 1) {
        return { name: "分数除法（整数÷分数）", text: "本题练的是「整数除以分数」。问的是：这个整数里面有几个这样的分数。" };
      }
      return { name: "分数除法（分数÷分数）", text: "本题练的是「分数除以分数」。问的是：被除数里面有几个除数。" };
    }

    function reasonOf(p) {
      const L = parseFrac(p.leftShow);
      const R = parseFrac(p.rightShow);
      if (L.d !== 1 && R.d === 1) {
        return (
          p.qShow + " 表示：把 " + p.leftShow + " 平均分成 " + p.rightShow + " 份，求每一份是多少。" +
          "平均分成 " + p.rightShow + " 份，就是求它的 " + p.rec + "，所以 ÷" + p.rightShow + " = ×" + p.rec + "。" +
          "写成算式：" + p.leftShow + " × " + p.rec + " = " + p.answer + "。" +
          "注意：把 " + p.rightShow + " 乘到分子上是在扩大，不是平均分，所以不能那样算。"
        );
      }
      if (L.d === 1 && R.d !== 1) {
        return (
          p.qShow + " 表示：" + p.leftShow + " 里面有几个 " + p.rightShow + "。" +
          "因为 " + p.rightShow + " × " + p.rec + " = 1，所以 1 里面有 " + p.rec + " 个 " + p.rightShow + "。" +
          "那么 " + p.leftShow + " 里面就有 " + p.leftShow + " × " + p.rec + " = " + p.answer + " 个。"
        );
      }
      return (
        p.qShow + " 表示：" + p.leftShow + " 里面有几个 " + p.rightShow + "。" +
        "除以 " + p.rightShow + "，等于乘它的倒数 " + p.rec + "。" +
        "因为 " + p.rightShow + " × " + p.rec + " = 1，1 份里正好有 " + p.rec + " 个 " + p.rightShow + "。" +
        "所以 " + p.leftShow + " × " + p.rec + " = " + p.answer + "。"
      );
    }

    function diagnose(p) {
      const L = parseFrac(p.leftShow), R = parseFrac(p.rightShow), ans = parseFrac(p.answer), S = p.stu;
      if (p.ok) return { level: "掌握较好", cause: "方法正确", detail: "会把除法改成乘倒数，并能得到正确得数，说明「分数除法」基本过关。" };
      if (!S) return { level: "还不能判断", cause: "缺少作答", detail: "先补上学生答案，才能判断对错并分析掌握程度。" };
      const mul = { n: L.n * R.n, d: L.d * R.d };
      const mulNum = { n: L.n * R.n, d: 1 };
      const flipAns = { n: ans.d, d: ans.n };
      const onlyNum = { n: L.n, d: 1 };
      const subDen = R.d === 1 ? { n: L.d - R.n, d: 1 } : null;
      if (sameFrac(S, mul) || sameFrac(S, mulNum)) return { level: "方法掌握不牢", cause: "方法选择", detail: "学生把整数乘到了分子上，没有把除数写成倒数。分数除法的核心是：除以一个数 = 乘它的倒数。" };
      if (subDen && sameFrac(S, onlyNum) && sameFrac(S, subDen)) return { level: "概念理解不足", cause: "概念理解", detail: "学生写了 " + p.stuShow + "。常见原因有两种：只抄了分子；或把分母和整数做减法。这两种都不是分数除法。" };
      if (sameFrac(S, onlyNum)) return { level: "概念理解不足", cause: "概念理解", detail: "学生只写下了被除数的分子，没有完成「乘倒数」。" };
      if (subDen && sameFrac(S, subDen)) return { level: "概念理解不足", cause: "概念理解", detail: "学生可能把分母和除数做了减法。分数除法不能用减法代替。" };
      if (sameFrac(S, L)) return { level: "概念理解不足", cause: "概念理解", detail: "学生几乎没有做除法，只是把原分数抄下来了。" };
      if (sameFrac(S, flipAns)) return { level: "概念易混淆", cause: "方法选择", detail: "学生可能把整道除法的结果又取了一次倒数。倒数只应对着除数来取。" };
      return { level: "还需巩固", cause: "方法或计算", detail: "学生答案和标准得数不一致。请先确认是否改成了乘倒数，再检查乘法和约分。" };
    }

    function buildGrade(left, right, stuRaw) {
      if (!left || !right || !right.n) return null;
      const leftShow = showFrac(left), rightShow = showFrac(right);
      const answer = simp(left.n * right.d, left.d * right.n);
      const rec = simp(right.d, right.n);
      const stu = parseFrac(stuRaw);
      const key = leftShow + " ÷ " + rightShow;
      const tip = BANK.find((x) => x.key === key) || { guide: ["找出除数。", "写成乘除数的倒数。", "约分成最简分数。"], drills: ["2/5 ÷ 3", "5/8 ÷ 4"] };
      const p = {
        qShow: key, leftShow, rightShow, rec, answer,
        stuShow: stuRaw ? (stu ? showFrac(stu) : stuRaw) : "",
        stu, ok: !!(stu && sameFrac(stu, parseFrac(answer))),
        kp: describeKp(left, right), guide: tip.guide, drills: tip.drills, note: ""
      };
      p.diag = diagnose(p);
      return p;
    }

    function reportOf(p) {
      const judge = !p.stuShow ? "还没有填写学生答案" : (p.ok ? "正确" : "错误");
      const head = p.note ? [p.note, ""] : [];
      return head.concat([
        "【题目】" + p.qShow,
        "【学生答案】" + (p.stuShow || "未填写"),
        "【正确答案】" + p.answer,
        "【判断】" + judge,
        "",
        "【知识点】" + p.kp.name,
        "【知识点说明】" + p.kp.text,
        "【算理】" + reasonOf(p),
        "【掌握程度】" + p.diag.level + "（可能原因：" + p.diag.cause + "）",
        "【掌握分析】" + p.diag.detail,
        "",
        "【计算过程】" + p.qShow + " = " + p.leftShow + " × " + p.rec + " = " + p.answer,
        "",
        "【订正引导】",
        "1. " + p.guide[0],
        "2. " + p.guide[1],
        "3. " + p.guide[2],
        "",
        "【巩固一下】",
        "1. " + p.drills[0],
        "2. " + p.drills[1]
      ]).join("\n");
    }

    function parseProblem(text) {
      const t = String(text || "").replace(/\s+/g, "").replace(/[÷:／]/g, "÷").replace(/＝/g, "=");
      let m = t.match(/(-?\d+(?:\/-?\d+)?)÷(-?\d+(?:\/-?\d+)?)(?:[,，。;；]*?(?:=|我写了?|答案是|答)(-?\d+(?:\/-?\d+)?))?/);
      if (m) return { left: parseFrac(m[1]), right: parseFrac(m[2]), stu: m[3] || "", note: "" };
      m = t.match(/^(-?\d+)\/(-?\d+)=(-?\d+(?:\/-?\d+)?)$/);
      if (m) {
        return {
          left: parseFrac(m[1]),
          right: parseFrac(m[2]),
          stu: m[3],
          note: "我按 " + m[1] + " ÷ " + m[2] + " = " + m[3] + " 来批改。如果题目是「分数 " + m[1] + "/" + m[2] + " 除以另一个数」，请补上除数。"
        };
      }
      m = t.match(/^(-?\d+)\/(-?\d+)$/);
      if (m) {
        return {
          left: parseFrac(m[1]),
          right: parseFrac(m[2]),
          stu: "",
          note: "我按 " + m[1] + " ÷ " + m[2] + " 来理解。若你写的是分数 " + m[1] + "/" + m[2] + "，请再补上除数和你的答案。"
        };
      }
      return null;
    }

    function knowledgeReply(text) {
      const t = text.replace(/\s+/g, "");
      if (/加减|通分|小数乘法|应用题/.test(t) && !/除法|倒数/.test(t)) {
        return "这不是本学伴的范围。我只讲六年级数学的「分数除法」。你可以问：分数除以整数怎么算？也可以把分数除法题目和答案发给我批改。";
      }
      if (/倒数/.test(t) && !/除法|除以|怎么算/.test(t)) {
        return "【知识点】倒数\n\n【算理】两个数相乘得 1，就互为倒数。把分数的分子、分母对调，乘起来正好是 1。整数 3 可以看成 3/1，倒数是 1/3，因为 3 × 1/3 = 1。\n\n例子：4/7 的倒数是 7/4；2 的倒数是 1/2。\n\n分数除法要用倒数：÷一个数，就是看「一份里有几个它」，所以改成乘它的倒数。\n\n要把题目和你的答案发给我批改吗？";
      }
      if (/整数除以分数|整数÷分数/.test(t)) {
        return "【知识点】分数除法（整数÷分数）\n\n【算理】3 ÷ 3/4 问的是：3 里面有几个 3/4。\n因为 3/4 × 4/3 = 1，所以 1 里面有 4/3 个 3/4。那么 3 里面就有 3 个「1 里面的个数」，也就是 3 × 4/3 = 4。\n所以整数÷分数，等于整数乘这个分数的倒数。\n\n【算法】3 ÷ 3/4 = 3 × 4/3 = 4。\n\n要把你的题目和答案发给我批改吗？";
      }
      if (/分数除以分数|分数÷分数/.test(t)) {
        return "【知识点】分数除法（分数÷分数）\n\n【算理】3/4 ÷ 1/2 问的是：3/4 里面有几个 1/2。\n1 里面有 2 个 1/2，所以除以 1/2 就是乘 2。也就是乘 1/2 的倒数。\n写成：3/4 ÷ 1/2 = 3/4 × 2/1 = 3/2。意思是 3/4 里有 1 个半的 1/2。\n\n【算法】除数的分子、分母对调后再乘，能约分先约分。\n\n要把你的题目和答案发给我批改吗？";
      }
      if (/分数除以整数|分数÷整数|怎么算|怎么做|怎样算|方法|知识点|为什么|乘倒数/.test(t)) {
        return "【知识点】分数除法（分数÷整数）\n\n【算理】4/7 ÷ 3 问的是：把 4/7 平均分成 3 份，每一份是多少。\n把一个数平均分成 3 份，就是求它的 1/3，所以 ÷3 等于 ×1/3。\n4/7 × 1/3 = 4/21，每一份就是 4/21。\n如果把 3 乘到分子上得到 12/7，那是把 4/7 扩大了 3 倍，不是平均分，所以错了。\n\n【算法】分数÷整数 = 分数 ×（1/整数），再约分。\n\n还可以问「整数除以分数怎么做」「分数除以分数怎么做」。也可以直接发题目给我批改。";
      }
      return "";
    }

    function reply(text) {
      const onlyAns = parseFrac(String(text || "").replace(/\s+/g, "").replace(/[÷／]/g, "/"));
      if (pending.left && pending.right && onlyAns && !/[÷/=]/.test(text.replace(/\s+/g, ""))) {
        const p = buildGrade(pending.left, pending.right, showFrac(onlyAns));
        pending.left = pending.right = "";
        return p ? reportOf(p) : "这一题我没有算清，请写成 4/7 ÷ 3，我写 12/7。";
      }
      const know = knowledgeReply(text);
      if (know) return know;
      const hit = parseProblem(text);
      if (hit && hit.left && hit.right) {
        if (!hit.stu) {
          pending.left = hit.left;
          pending.right = hit.right;
          const p0 = buildGrade(hit.left, hit.right, "");
          if (p0) {
            p0.note = hit.note || "";
            return reportOf(p0) + "\n\n还没有看到你的得数。请把你当时写的答案发给我。";
          }
          return "题目我记下了：" + showFrac(hit.left) + " ÷ " + showFrac(hit.right) + "。请把你的答案发给我，我再帮你批改。";
        }
        pending.left = pending.right = "";
        const p = buildGrade(hit.left, hit.right, hit.stu);
        if (!p) return "算式我还没读清，请写成 4/7 ÷ 3，我写 12/7。";
        p.note = hit.note || "";
        return reportOf(p);
      }
      return "你刚才写的是「" + String(text || "").trim() + "」。这还不是完整的分数除法。\n请写成：被除数 ÷ 除数，我写 答案。\n例如：3 ÷ 1/4，我写 12\n例如：4/7 ÷ 3，我写 12/7";
    }

    function addMsg(role, text) {
      const box = document.createElement("div");
      box.className = "msg " + (role === "me" ? "me" : "bot");
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "me" ? "学生" : "学伴";
      who.dataset.role = role;
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      box.appendChild(who);
      box.appendChild(body);
      chatEl.appendChild(box);
      chatEl.scrollTop = chatEl.scrollHeight;
      return body;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function llmText(res) {
      if (res == null) return "";
      if (typeof res === "string") return res.trim();
      if (typeof res.text === "string") return res.text.trim();
      if (res.message && typeof res.message.content === "string") return res.message.content.trim();
      if (typeof res.content === "string") return res.content.trim();
      return String(res).trim();
    }

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
      ]);
    }

    function looksLikeError(text) {
      return /402|Payment Required|error|unauthorized|API key/i.test(text || "");
    }

    async function askModel(userText, local) {
      const prompt = (
        "你是六年级分数除法学伴。必须用简体中文回答。学生说：" + userText +
        "\n下面是本地已经算好的内容，对错和正确答案不要改：\n" + local
      ).slice(0, 1400);
      const url = "https://text.pollinations.ai/" + encodeURIComponent(prompt) + "?model=openai";
      const getRes = await withTimeout(fetch(url), 12000);
      if (getRes.ok) {
        const text = (await getRes.text()).trim();
        if (text && !looksLikeError(text)) return text;
      }
      const postRes = await withTimeout(fetch("https://text.pollinations.ai/openai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "openai",
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: "学生：" + userText + "\n本地结果：\n" + local }
          ]
        })
      }), 12000);
      if (!postRes.ok) throw new Error("http");
      const data = await postRes.json();
      const text = llmText(data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content
        : data);
      if (!text || looksLikeError(text)) throw new Error("empty");
      return text;
    }

    async function send(text) {
      const t = String(text || "").trim();
      if (!t || busy) return;
      busy = true;
      addMsg("me", t);
      talkEl.value = "";
      const wait = addMsg("bot", "正在回答…");
      const local = reply(t);
      try {
        const modelText = await askModel(t, local);
        wait.textContent = modelText;
        wait.parentNode.querySelector(".who").textContent = "学伴 · 大模型";
        history.push({ role: "user", content: t });
        history.push({ role: "assistant", content: modelText });
        setStatus("已接通免费大模型。");
      } catch (_) {
        wait.textContent = local;
        wait.parentNode.querySelector(".who").textContent = "学伴 · 本地规则";
        history.push({ role: "user", content: t });
        history.push({ role: "assistant", content: local });
        setStatus("免费接口没连上，这次用本地规则回答，不用登录。");
      }
      busy = false;
      talkEl.focus();
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    addMsg("bot", HELLO);
    setStatus("不用登录。能连上免费接口就用大模型，连不上就本地批改。");
    document.getElementById("sendBtn").addEventListener("click", () => send(talkEl.value));
    talkEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(talkEl.value); });
    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => send(btn.getAttribute("data-q")));
    });
  </script>
</body>
</html>
