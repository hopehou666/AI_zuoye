<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>错题诊断与个性化复习助手 · AI智能体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2b3c; --muted: #5a6b7c; --bg: #eef4f1; --panel: #fffdf8;
      --line: #d8cfc0; --accent: #0d7a6f; --accent-deep: #065a52;
      --bot: #eef8f6; --user: #fff4e8; --shadow: 0 12px 40px rgba(26,43,60,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Noto Sans SC", sans-serif; color: var(--ink);
      background:
        radial-gradient(900px 480px at 0% 0%, #dceeea, transparent 60%),
        radial-gradient(700px 400px at 100% 0%, #f3e2d4, transparent 55%),
        var(--bg);
      display: flex; flex-direction: column;
    }
    header {
      padding: 18px 20px 10px; width: min(860px, 100%); margin: 0 auto;
    }
    .brand {
      font-family: "ZCOOL XiaoWei", serif; font-size: 1.55rem; color: var(--accent-deep);
      display: flex; align-items: center; gap: 10px;
    }
    .brand i {
      width: 12px; height: 12px; border-radius: 3px; background: var(--accent);
      box-shadow: 0 0 0 5px rgba(13,122,111,.15);
    }
    header p { margin: 8px 0 0; color: var(--muted); font-size: .92rem; line-height: 1.6; }
    .shell {
      flex: 1; width: min(860px, calc(100% - 24px)); margin: 0 auto 20px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 70vh;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 88%; padding: 12px 14px; border-radius: 14px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word; font-size: .95rem;
      animation: rise .25s ease;
    }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid #c6e4de; }
    .msg.user { align-self: flex-end; background: var(--user); border: 1px solid #edd7b8; }
    .msg .who { display: block; font-size: .75rem; font-weight: 700; margin-bottom: 4px; opacity: .7; }
    .quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px; }
    .quick button {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 8px 12px; font: inherit; font-size: .82rem; cursor: pointer; color: var(--ink);
    }
    .quick button:hover { border-color: var(--accent); color: var(--accent-deep); }
    .composer {
      display: flex; gap: 10px; padding: 14px 16px 16px; border-top: 1px solid var(--line);
    }
    .composer textarea {
      flex: 1; resize: none; min-height: 52px; max-height: 120px; border-radius: 12px;
      border: 1.5px solid var(--line); padding: 12px; font: inherit; background: #fff;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .composer button {
      border: none; border-radius: 12px; padding: 0 18px; background: var(--accent);
      color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    .composer button:hover { background: var(--accent-deep); }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><i></i>错题诊断与个性化复习助手</div>
    <p>路径1 · AI 智能体（可直接对话）。把错题发给我（最好带年级、学科和你的答案）。</p>
  </header>

  <div class="shell">
    <div id="chat" aria-live="polite"></div>
    <div class="quick" id="quick">
      <button type="button" data-q="六年级数学。小明有3/4米彩带，用去2/5，还剩多少米？我算成1/20米。">示例：分数减法错题</button>
      <button type="button" data-q="六年级数学。圆半径3cm，求周长（π=3.14）。我用了πr²。">示例：圆周长错题</button>
      <button type="button" data-q="六年级数学。一件上衣200元打八折，多少钱？我答240元。">示例：百分数错题</button>
    </div>
    <form class="composer" id="form">
      <textarea id="input" placeholder="输入错题：年级 + 学科 + 题目 + 你的答案…" rows="2"></textarea>
      <button type="submit">发送</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const form = document.getElementById("form");

    const mem = { grade: "", subject: "", question: "", answer: "", step: "collect" };

    const OPENING =
      "把错题发给我（最好带年级、学科和你的答案），我帮你找出薄弱点，再给你两道巩固题和 3 天小复习计划。\n\n" +
      "也可以先点下方示例按钮试一试。";

    function addMsg(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "bot" ? "智能体" : "我";
      div.appendChild(who);
      div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function extract(text) {
      const t = text.replace(/\s+/g, " ").trim();
      const gradeM = t.match(/(小学)?(五|六)年级|初[一二三]|六年级|五年级/);
      if (gradeM) mem.grade = gradeM[0].includes("初") ? gradeM[0] : (gradeM[0].includes("五") ? "小学五年级" : "小学六年级");
      if (/数学/.test(t)) mem.subject = "数学";
      else if (/语文/.test(t)) mem.subject = "语文";
      else if (/英语/.test(t)) mem.subject = "英语";

      const ansM = t.match(/(?:我(?:的答案|算成|答|写成|填了|得到)[:：]?\s*)([^\n。]+)/);
      if (ansM) mem.answer = ansM[1].trim();

      let q = t
        .replace(/(小学)?(五|六)年级|初[一二三]|数学|语文|英语/g, " ")
        .replace(/(?:我(?:的答案|算成|答|写成|填了|得到)[:：]?\s*)([^\n。]+)/, " ")
        .replace(/\s+/g, " ")
        .trim();
      if (q.length > 6) mem.question = q;
    }

    function missing() {
      const miss = [];
      if (!mem.grade) miss.push("年级");
      if (!mem.subject) miss.push("学科");
      if (!mem.question) miss.push("错题原文");
      return miss;
    }

    function diagnose() {
      const q = mem.question + " " + mem.answer;
      let kp = "综合练习";
      let cause = "概念理解";
      let tip = "先把题目条件划出来，再选对应方法。";
      let guide = ["先读题，圈出已知和所求。", "想一想该用哪一类方法。", "分步计算并验算。"];
      let drills = ["请再出一道同类型题自己练。", "把今天的错题订正步骤写完整。"];

      if (/分数|\/|÷|×|彩带|几分之/.test(q)) {
        if (/用去其中|的.*分之|×/.test(q) || /求一个数的/.test(q)) {
          kp = "分数乘法（求一个数的几分之几）";
          cause = "概念理解";
          tip = "求一个数的几分之几时用乘法，不是减法。";
          guide = ["判断：是“用去多少”还是“还剩多少”？", "若求用去的部分：总量 × 几分之几。", "算完要约成最简分数，再对照题意。"];
          drills = ["一桶油 4/5 升，用去 1/3，用去了多少升？", "一段绳 5/6 米，剪去其中 2/5，剪去多少米？"];
        } else if (/还剩|减去|减/.test(q) || /1\/20|通分/.test(q)) {
          kp = "异分母分数加减";
          cause = "计算失误";
          tip = "异分母要先通分再加减。";
          guide = ["写出两个分数的分母。", "通分到最小公倍数。", "分子相减（或加）后再约分。"];
          drills = ["计算：5/6 − 1/4", "计算：2/3 + 1/6"];
        } else if (/÷|除以|倒数/.test(q)) {
          kp = "分数除法与倒数";
          cause = "方法选择";
          tip = "除以一个数 = 乘它的倒数。";
          guide = ["找到除数。", "写出除数的倒数。", "改成乘法并计算约分。"];
          drills = ["计算：3/4 ÷ 2/5", "一个数的倒数是 5/8，这个数是多少？"];
        } else {
          kp = "分数四则混合运算";
          cause = "方法选择";
          tip = "先乘除后加减，有括号先算括号。";
          guide = ["标出运算顺序。", "先算乘除。", "再通分做加减。"];
          drills = ["计算：1/2 + 1/3 × 1/4", "计算：(1/2 + 1/3) × 6/5"];
        }
      } else if (/圆|周长|面积|半径|直径|π|pi/i.test(q)) {
        if (/面积|πr²|r\^?2|平方/.test(q) && /周长|用了/.test(q)) {
          kp = "圆的周长与面积公式区分";
          cause = "方法选择";
          tip = "周长 C=2πr 或 πd；面积 S=πr²。";
        } else if (/周长/.test(q)) {
          kp = "圆的周长";
          cause = "方法选择";
          tip = "C=2πr（或 πd）。";
        } else {
          kp = "圆的面积";
          cause = "概念理解";
          tip = "S=πr²，半径要先平方。";
        }
        guide = ["确认题目求周长还是面积。", "写出对应公式。", "代入 π 与 r 计算并带单位。"];
        drills = ["半径 5cm，求周长（π=3.14）。", "半径 4cm，求面积（π=3.14）。"];
      } else if (/百分|折扣|八折|%|百分之/.test(q)) {
        kp = "百分数的意义与应用";
        cause = "概念理解";
        tip = "几折 = 百分之几十；求现价用 原价 × 折扣。";
        guide = ["把折扣改成百分数（八折=80%）。", "列式：原价 × 80%。", "验算：现价应比原价小。"];
        drills = ["原价 160 元，打七五折后多少元？", "把 3/5 写成百分数。"];
      } else if (/比\s|化简|：|:/.test(q)) {
        kp = "比的意义与化简";
        cause = "计算失误";
        tip = "前后项同除以最大公约数，化成最简整数比。";
        guide = ["写出比的前项和后项。", "找最大公约数。", "同除后检查是否最简。"];
        drills = ["把 12:18 化成最简整数比。", "甲 20、乙 5，甲:乙=？"];
      }

      return { kp, cause, tip, guide, drills };
    }

    function buildReply(userText) {
      extract(userText);
      const miss = missing();
      if (miss.length) {
        const ask = miss.slice(0, 2).join("、");
        return `我还需要补充：${ask}。\n请一次性发给我，例如：「六年级数学。题目……。我的答案是……。」`;
      }

      const d = diagnose();
      const plan =
        `【3天复习计划】\n` +
        `- Day1（15～20分钟）：复习「${d.kp}」概念/公式，订正本错题并写出完整步骤。\n` +
        `- Day2（15～20分钟）：完成巩固题1、巩固题2，不会的只看提示不看答案思路。\n` +
        `- Day3（15～20分钟）：合上材料，口述解题思路，再限时做 2 道同类题自我检测。`;

      return (
        `【知识点】${d.kp}\n` +
        `【错因类型】${d.cause}（${d.tip}）\n` +
        `【诊断说明】结合你的作答「${mem.answer || "未填写"}」，更可能卡在方法或概念上。先别急着看最终答案，我们一步步来。\n\n` +
        `【订正引导】\n1. ${d.guide[0]}\n2. ${d.guide[1]}\n3. ${d.guide[2]}\n` +
        `想好每一步后再算。如果你已经订正过、只要完整讲解，回复「只要讲解」。\n\n` +
        `【巩固题1】${d.drills[0]}\n` +
        `【巩固题2】${d.drills[1]}\n` +
        `（巩固题先不给标准答案，做完再来对。）\n\n` +
        plan
      );
    }

    function replyExplain() {
      const d = diagnose();
      return (
        `好的，给你完整思路提纲（仍建议你自己算一遍）：\n` +
        `1) 知识点：${d.kp}\n` +
        `2) 关键提醒：${d.tip}\n` +
        `3) 步骤：${d.guide.join(" → ")}\n` +
        `4) 算完后用估算或代入验算。\n\n` +
        `需要的话继续发下一道错题。`
      );
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, "user");
      input.value = "";
      setTimeout(() => {
        const out = /只要讲解|完整解析|直接讲/.test(text) && mem.question
          ? replyExplain()
          : buildReply(text);
        addMsg(out, "bot");
      }, 280);
    });

    document.getElementById("quick").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-q]");
      if (!btn) return;
      input.value = btn.getAttribute("data-q");
      form.requestSubmit();
    });

    addMsg(OPENING, "bot");
  </script>
</body>
</html>
