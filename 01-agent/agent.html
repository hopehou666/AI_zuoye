<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分数除法习题学伴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --ink: #1a2b3c; --muted: #5a6b7c; --bg: #eef4f1; --panel: #fffdf8;
      --line: #d8cfc0; --accent: #0d7a6f; --accent-deep: #065a52;
      --ok: #1f7a4c; --bad: #b33a3a; --shadow: 0 12px 40px rgba(26,43,60,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Noto Sans SC", sans-serif; color: var(--ink);
      background:
        radial-gradient(900px 480px at 0% 0%, #dceeea, transparent 60%),
        radial-gradient(700px 400px at 100% 0%, #f3e2d4, transparent 55%),
        var(--bg);
    }
    .wrap { width: min(720px, calc(100% - 24px)); margin: 0 auto; padding: 20px 0 48px; }
    .home-link { color: var(--accent-deep); font-weight: 700; text-decoration: none; font-size: .9rem; }
    .brand {
      font-family: "ZCOOL XiaoWei", serif; font-size: 1.7rem; color: var(--accent-deep);
      display: flex; align-items: center; gap: 10px; margin: 10px 0 4px;
    }
    .brand i {
      width: 12px; height: 12px; border-radius: 3px; background: var(--accent);
      box-shadow: 0 0 0 5px rgba(13,122,111,.15);
    }
    .tag { display: inline-block; font-size: .82rem; font-weight: 700; color: var(--accent-deep); background: #eef8f6; border: 1px solid #b7ddd6; border-radius: 999px; padding: 3px 10px; }
    .desc { margin: 10px 0 16px; color: var(--muted); line-height: 1.65; font-size: .93rem; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px;
    }
    .step { font-size: .75rem; letter-spacing: .12em; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    h2 { margin: 0 0 12px; font-size: 1.12rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .chip, .btn { appearance: none; font: inherit; cursor: pointer; border-radius: 12px; }
    .chip { border: 1.5px solid var(--line); background: #fff; padding: 8px 14px; }
    .chip.on { border-color: var(--accent); background: #eef8f6; color: var(--accent-deep); font-weight: 700; }
    .lock { opacity: .7; cursor: default; }
    .btn { border: none; padding: 10px 18px; background: var(--accent); color: #fff; font-weight: 700; }
    .btn:hover { background: var(--accent-deep); }
    .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
    .drop {
      display: block; border: 1.5px dashed #b7ddd6; border-radius: 14px; background: #f7fbfa;
      padding: 22px 16px; text-align: center; color: var(--muted); line-height: 1.65; cursor: pointer;
    }
    .drop input { display: none; }
    .preview { max-width: 100%; max-height: 260px; margin-top: 12px; border-radius: 10px; }
    .status { font-size: .88rem; color: var(--muted); margin-top: 10px; line-height: 1.6; }
    .verdict { padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; line-height: 1.65; font-weight: 700; }
    .verdict.ok { background: #e8f6ee; color: var(--ok); border: 1px solid #b7e0c7; }
    .verdict.mid { background: #fff7e8; color: #9a6400; border: 1px solid #efd8a6; }
    .verdict.bad { background: #fceeee; color: var(--bad); border: 1px solid #efc2c2; }
    .report { white-space: pre-wrap; line-height: 1.75; }
    .hidden { display: none !important; }
    label.field { display: block; color: var(--muted); font-size: .82rem; margin: 10px 0 6px; }
    textarea, input.line {
      width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 10px; font: inherit; background: #fff; color: var(--ink);
    }
    textarea { min-height: 56px; resize: vertical; }
    .expr { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .expr input.line { flex: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home-link" href="../index.html">← 返回导航</a>
    <div class="brand"><i></i>分数除法习题学伴</div>
    <span class="tag">六年级数学 · 分数除法</span>
    <p class="desc">只练一个知识点：分数除法。把习题和解答拍在同一张图里上传，学伴自动批改，并分析你对分数除法的掌握程度。做对了也可以拍。</p>

    <section class="panel">
      <div class="step">01 拍照上传习题</div>
      <h2>把题目和解答拍在同一张图里</h2>
      <label class="drop">
        点击拍照或从相册选择<br />印刷体更清楚；字迹模糊时可在下方改几个字。
        <input id="file" type="file" accept="image/*" capture="environment" />
        <img id="preview" class="preview hidden" alt="习题照片" />
      </label>
      <p class="status" id="ocrStatus">上传后将自动批改。手写认不清时，把算式打在下面一行即可。</p>
      <label class="field" for="exprLine">算式（手写认不清时补这一行）</label>
      <div class="expr">
        <input class="line" id="exprLine" type="text" placeholder="例如：4/7 ÷ 3 = 12/7" />
        <button type="button" class="btn" id="exprBtn">批改</button>
      </div>
      <label class="field" for="ocrText">识别文字</label>
      <textarea id="ocrText" placeholder="识别结果"></textarea>
    </section>

    <section class="panel hidden" id="resultPanel">
      <div class="step">02 批改结果</div>
      <h2>分数除法掌握分析</h2>
      <div id="verdict" class="verdict"></div>
      <div id="report" class="report"></div>
      <div class="row" style="margin-top:14px;">
        <button type="button" class="btn ghost" id="againBtn">再批改一张</button>
      </div>
    </section>
  </div>

  <script>
    const BANK = [
      { q: "计算：3/5 ÷ 2/5 = ？", answer: "3/2", aliases: ["1.5", "1又1/2"], kp: "分数除法", cause: "方法选择", tip: "除以一个数等于乘它的倒数。", guide: ["找到除数 2/5。", "改成乘 5/2。", "约分得最简分数。"], drills: ["3/4 ÷ 1/2", "5/6 ÷ 2/3"] },
      { q: "计算：3/4 ÷ 1/2 = ？", answer: "3/2", aliases: ["1.5"], kp: "分数除法", cause: "方法选择", tip: "除以一个数等于乘它的倒数。", guide: ["1/2 的倒数是 2。", "3/4 × 2/1。", "约分成 3/2。"], drills: ["2/3 ÷ 1/4", "5/8 ÷ 1/2"] },
      { q: "计算：1 ÷ 2/5 = ？", answer: "5/2", aliases: ["2.5", "2又1/2"], kp: "分数除法", cause: "方法选择", tip: "1 乘除数的倒数。", guide: ["2/5 的倒数是 5/2。", "1 × 5/2。", "结果是 5/2。"], drills: ["1 ÷ 3/4", "1 ÷ 1/8"] },
      { q: "计算：2/3 ÷ 4 = ？", answer: "1/6", aliases: ["2/12"], kp: "分数除法", cause: "方法选择", tip: "除以整数 4，等于乘 1/4。", guide: ["4 的倒数是 1/4。", "2/3 × 1/4。", "约分成 1/6。"], drills: ["3/5 ÷ 3", "5/6 ÷ 5"] },
      { q: "计算：4/7 ÷ 3 = ？", answer: "4/21", aliases: ["4/21"], kp: "分数除法", cause: "方法选择", tip: "除以整数 3，等于乘 1/3，不是把 3 乘到分子上。", guide: ["3 的倒数是 1/3。", "4/7 × 1/3。", "得到 4/21。"], drills: ["2/5 ÷ 3", "5/8 ÷ 4"] },
      { q: "计算：5/6 ÷ 2/3 = ？", answer: "5/4", aliases: ["1.25", "1又1/4"], kp: "分数除法", cause: "计算失误", tip: "先写倒数再乘，能约分先约。", guide: ["2/3 的倒数是 3/2。", "5/6 × 3/2，6 和 3 先约分。", "得到 5/4。"], drills: ["4/9 ÷ 2/3", "7/8 ÷ 7/12"] },
      { q: "计算：3 ÷ 3/4 = ？", answer: "4", aliases: ["4/1"], kp: "分数除法", cause: "方法选择", tip: "整数除以分数 = 乘倒数。", guide: ["3/4 的倒数是 4/3。", "3 × 4/3。", "约分成 4。"], drills: ["2 ÷ 1/5", "6 ÷ 2/3"] },
      { q: "一个数的倒数是 4/7，这个数是？", answer: "7/4", aliases: ["1.75"], kp: "分数除法", cause: "概念理解", tip: "互为倒数的两数乘积是 1。", guide: ["倒数是 4/7。", "把分数倒过来。", "这个数是 7/4。"], drills: ["倒数是 5/8 的数是？", "倒数是 3 的数是？"] },
      { q: "一瓶果汁 3/4 升，倒入容量 1/8 升的杯子，最多能倒满几杯？", answer: "6", aliases: ["6杯"], kp: "分数除法", cause: "概念理解", tip: "总量 ÷ 每份量 = 份数。", guide: ["求能倒几杯，用除法。", "3/4 ÷ 1/8。", "3/4 × 8/1 = 6。"], drills: ["4/5 米绳子，每段 1/10 米，可剪几段？", "5/6 升油，每瓶 1/3 升，能装几瓶？"] },
      { q: "一段绳子长 4/5 米，每段剪 1/10 米，最多可剪几段？", answer: "8", aliases: ["8段"], kp: "分数除法", cause: "概念理解", tip: "总长 ÷ 每段长。", guide: ["4/5 ÷ 1/10。", "1/10 的倒数是 10。", "4/5 × 10 = 8。"], drills: ["3/4 米，每段 1/8 米，可剪几段？", "6/7 米，每段 2/7 米，可剪几段？"] }
    ];

    const state = { item: null, stuAns: "" };
    const el = {
      ocrStatus: document.getElementById("ocrStatus"),
      ocrText: document.getElementById("ocrText"),
      preview: document.getElementById("preview"),
      resultPanel: document.getElementById("resultPanel"),
      verdict: document.getElementById("verdict"),
      report: document.getElementById("report")
    };

    function norm(s) {
      return String(s || "")
        .replace(/\s+/g, "")
        .replace(/[−–—]/g, "-")
        .replace(/[：]/g, ":")
        .replace(/[×xX]/g, "*")
        .replace(/[÷／]/g, "/")
        .replace(/厘米|米|元|个|本|杯|千米|平方厘米|立方厘米|cm³|cm²|cm|km/gi, "")
        .replace(/[。．.？?，,！、]/g, "")
        .toLowerCase();
    }

    function tokens(s) {
      return norm(s).replace(/[^\u4e00-\u9fa50-9a-z:/*+-]/g, " ").split(/\s+/).filter((w) => w.length >= 1);
    }

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) { const t = a % b; a = b; b = t; }
      return a || 1;
    }

    function simp(n, d) {
      if (!d) return "";
      const g = gcd(n, d);
      n /= g; d /= g;
      if (d < 0) { n = -n; d = -d; }
      return d === 1 ? String(n) : n + "/" + d;
    }

    function parseFrac(s) {
      const m = String(s || "").trim().match(/^(-?\d+)(?:\/(-?\d+))?$/);
      if (!m) return null;
      return { n: +m[1], d: m[2] ? +m[2] : 1 };
    }

    function parseDivEq(text) {
      const t = String(text || "").replace(/\s+/g, "").replace(/[÷:／]/g, "÷").replace(/＝/g, "=");
      const m = t.match(/(-?\d+(?:\/-?\d+)?)÷(-?\d+(?:\/-?\d+)?)(?:=(-?\d+(?:\/-?\d+)?))?/);
      if (!m) return null;
      const left = parseFrac(m[1]);
      const right = parseFrac(m[2]);
      if (!left || !right || !right.n) return null;
      const q = `计算：${simp(left.n, left.d)} ÷ ${simp(right.n, right.d)} = ？`;
      const answer = simp(left.n * right.d, left.d * right.n);
      const stu = m[3] || "";
      const hit = BANK.find((x) => x.q.includes(`${simp(left.n, left.d)} ÷ ${simp(right.n, right.d)}`));
      const item = hit || {
        q,
        answer,
        aliases: [answer],
        kp: "分数除法",
        cause: "方法选择",
        tip: "除以一个数等于乘它的倒数。分数÷整数，要把整数写成倒数再乘。",
        guide: ["找出除数。", "写成乘除数的倒数。", "约分成最简分数。"],
        drills: ["2/5 ÷ 3", "5/8 ÷ 4"]
      };
      if (!hit) item.answer = answer;
      return { item, stu };
    }

    function matchBank(text) {
      if (!/\d/.test(text || "")) return null;
      const pool = BANK;
      const tks = tokens(text);
      let best = null, bestScore = 0;
      pool.forEach((item) => {
        const its = tokens(item.q);
        let hit = 0;
        tks.forEach((w) => { if (its.some((k) => k.includes(w) || w.includes(k))) hit += 1; });
        const score = hit / Math.max(its.length, 3);
        if (score > bestScore) { bestScore = score; best = item; }
      });
      return bestScore >= 0.28 ? best : null;
    }

    function extractAns(text, item) {
      const raw = String(text || "");
      const labeled = raw.match(/(?:答|解|作答|答案)\s*[:：=]?\s*([^\n。]{1,20})/);
      if (labeled) return labeled[1].trim();
      const cands = [item.answer].concat(item.aliases || []);
      const ntext = norm(raw);
      for (const c of cands) {
        if (c && ntext.includes(norm(c))) return c;
      }
      const nums = raw.match(/-?\d+\s*[:：/／.]\s*\d+%?|-?\d+(?:\.\d+)?%?|负\d+/g);
      return nums && nums.length ? nums[nums.length - 1] : "";
    }

    function sameAns(user, item) {
      const u = norm(user);
      if (!u) return false;
      return [item.answer].concat(item.aliases || []).map(norm).some((c) => c && (u === c || u.includes(c) || c.includes(u)));
    }

    function reportOf(item, userAns, ok) {
      if (ok) {
        return (
          `【匹配题目】${item.q}\n` +
          `【识别作答】${userAns || "已从照片中识别到正确答案"}\n` +
          `【知识点】${item.kp}\n` +
          `【掌握程度】掌握较好。这道题做对了，说明「${item.kp}」基本过关。\n` +
          `【提醒】${item.tip}\n\n` +
          `【巩固一下】\n1. ${item.drills[0]}\n2. ${item.drills[1]}\n\n` +
          `【3天小计划】\n- Day1：把本题步骤再写一遍，确认公式或方法。\n- Day2：做上面 2 道同类题。\n- Day3：限时口述思路，自我检测。`
        );
      }
      return (
        `【匹配题目】${item.q}\n` +
        `【识别作答】${userAns || "照片里没有稳定识别到作答"}\n` +
        `【知识点】${item.kp}\n` +
        `【掌握程度】该知识点还需巩固（可能原因：${item.cause}）。\n` +
        `【分析】${item.tip}\n\n` +
        `【订正引导】\n1. ${item.guide[0]}\n2. ${item.guide[1]}\n3. ${item.guide[2]}\n` +
        `先按步骤自己再算，标准得数先不写在这里。\n\n` +
        `【巩固一下】\n1. ${item.drills[0]}\n2. ${item.drills[1]}\n\n` +
        `【3天小计划】\n- Day1：订正本题，写清步骤。\n- Day2：完成 2 道巩固题。\n- Day3：合上材料口述思路后再做 2 道同类题。`
      );
    }

    function showResult(item, userAns, ok, note) {
      state.item = item;
      state.stuAns = userAns;
      el.resultPanel.classList.remove("hidden");
      el.verdict.className = "verdict " + (ok ? "ok" : (userAns ? "bad" : "mid"));
      if (!item) {
        el.verdict.textContent = "还没有匹配到分数除法习题，请把识别文字改清楚，或换一张更清晰的照片。";
        el.report.textContent = note || "";
        return;
      }
      el.verdict.textContent = ok
        ? "批改：正确。这道作业做对了，下面看知识点掌握情况。"
        : (userAns
          ? "批改：与标准答案不一致。下面分析相关知识点掌握程度。"
          : "已匹配到题目，但作答识别不稳定。请把解答拍清楚后再传一次。");
      el.report.textContent = item ? reportOf(item, userAns, ok) : "";
      el.resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    let ocrWorker = null;
    let ocrReady = false;

    function preprocessImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          const minSide = 1400;
          const scale = Math.max(minSide / Math.min(w, h), 1);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h);
          const p = data.data;
          for (let i = 0; i < p.length; i += 4) {
            const g = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2];
            const v = g < 150 ? 0 : 255;
            p[i] = p[i + 1] = p[i + 2] = v;
          }
          ctx.putImageData(data, 0, 0);
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("prep")), "image/png");
        };
        img.onerror = () => reject(new Error("img"));
        img.src = URL.createObjectURL(file);
      });
    }

    async function ensureOcr() {
      if (ocrWorker && ocrReady) return ocrWorker;
      if (!window.Tesseract) throw new Error("ocr");
      if (!ocrWorker) {
        el.ocrStatus.textContent = "正在启动识别…";
        ocrWorker = await window.Tesseract.createWorker("eng");
        await ocrWorker.setParameters({
          tessedit_char_whitelist: "0123456789/=-+. ",
          tessedit_pageseg_mode: "6"
        });
        ocrReady = true;
      }
      return ocrWorker;
    }

    async function warmupOcr() {
      try {
        if (!window.Tesseract) return;
        el.ocrStatus.textContent = "识别已就绪，可以直接拍照。";
        await ensureOcr();
        el.ocrStatus.textContent = "识别已就绪，上传后约 2～4 秒出结果。";
      } catch (_) {
        el.ocrStatus.textContent = "上传后将自动批改分数除法习题。";
      }
    }

    async function gradePhoto(file) {
      el.preview.src = URL.createObjectURL(file);
      el.preview.classList.remove("hidden");
      el.resultPanel.classList.add("hidden");
      el.ocrStatus.textContent = "正在识别算式…";
      try {
        const prepared = await preprocessImage(file);
        const worker = await ensureOcr();
        const { data } = await worker.recognize(prepared);
        const text = (data && data.text ? data.text : "").replace(/\n{2,}/g, "\n").trim();
        el.ocrText.value = text;
        if (!/\d/.test(text)) {
          el.ocrStatus.textContent = "手写分数不太好认。请在上面一行补全算式，例如 4/7 ÷ 3 = 12/7，再点「批改」。";
          document.getElementById("exprLine").focus();
          return;
        }
        autoGrade(text);
      } catch (_) {
        el.ocrStatus.textContent = "识别没有成功。请在上面一行写出算式后点「批改」。";
        document.getElementById("exprLine").focus();
      }
    }

    function autoGrade(text) {
      const parsed = parseDivEq(text);
      const item = parsed ? parsed.item : matchBank(text);
      const stu = parsed ? parsed.stu : (item ? extractAns(text, item) : "");
      if (!item) {
        el.ocrStatus.textContent = "还没读成分数除法算式。请写成 4/7 ÷ 3 = 12/7 这样，再点「批改」。";
        el.resultPanel.classList.add("hidden");
        return;
      }
      const ans = stu || extractAns(text, item);
      const ok = sameAns(ans, item);
      el.ocrStatus.textContent = "已批改。";
      showResult(item, ans, ok);
    }

    document.getElementById("file").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) gradePhoto(file);
    });

    function gradeFromLine() {
      const line = document.getElementById("exprLine").value.trim();
      const text = line || el.ocrText.value.trim();
      if (!text) {
        alert("请先拍照，或写出算式，例如 4/7 ÷ 3 = 12/7");
        return;
      }
      autoGrade(text);
    }

    document.getElementById("exprBtn").addEventListener("click", gradeFromLine);
    document.getElementById("exprLine").addEventListener("keydown", (e) => {
      if (e.key === "Enter") gradeFromLine();
    });

    el.ocrText.addEventListener("change", () => {
      const text = el.ocrText.value.trim();
      if (/\d/.test(text) && text.length > 3) autoGrade(text);
    });

    document.getElementById("againBtn").addEventListener("click", () => {
      el.resultPanel.classList.add("hidden");
      el.ocrText.value = "";
      document.getElementById("exprLine").value = "";
      el.ocrStatus.textContent = "识别已就绪，可以直接再拍一张。手写不清时写出算式即可。";
      el.preview.classList.add("hidden");
      document.getElementById("file").value = "";
    });

    warmupOcr();
  </script>
</body>
</html>
