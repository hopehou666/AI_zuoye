<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分数除法习题学伴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2b3c; --muted: #5a6b7c; --bg: #eef4f1; --panel: #fffdf8;
      --line: #d8cfc0; --accent: #0d7a6f; --accent-deep: #065a52;
      --ok: #1f7a4c; --bad: #b33a3a; --shadow: 0 12px 40px rgba(26,43,60,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Noto Sans SC", sans-serif; color: var(--ink);
      background:
        radial-gradient(900px 480px at 0% 0%, #dceeea, transparent 60%),
        radial-gradient(700px 400px at 100% 0%, #f3e2d4, transparent 55%),
        var(--bg);
    }
    .wrap { width: min(720px, calc(100% - 24px)); margin: 0 auto; padding: 20px 0 48px; }
    .home-link { color: var(--accent-deep); font-weight: 700; text-decoration: none; font-size: .9rem; }
    .brand {
      font-family: "ZCOOL XiaoWei", serif; font-size: 1.7rem; color: var(--accent-deep);
      display: flex; align-items: center; gap: 10px; margin: 10px 0 4px;
    }
    .brand i {
      width: 12px; height: 12px; border-radius: 3px; background: var(--accent);
      box-shadow: 0 0 0 5px rgba(13,122,111,.15);
    }
    .tag { display: inline-block; font-size: .82rem; font-weight: 700; color: var(--accent-deep); background: #eef8f6; border: 1px solid #b7ddd6; border-radius: 999px; padding: 3px 10px; }
    .desc { margin: 10px 0 16px; color: var(--muted); line-height: 1.65; font-size: .93rem; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px;
    }
    .step { font-size: .75rem; letter-spacing: .12em; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
    h2 { margin: 0 0 12px; font-size: 1.12rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .btn { appearance: none; font: inherit; cursor: pointer; border-radius: 12px; border: none; padding: 10px 18px; background: var(--accent); color: #fff; font-weight: 700; }
    .btn:hover { background: var(--accent-deep); }
    .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
    .hint { font-size: .88rem; color: var(--muted); margin: 0 0 12px; line-height: 1.6; }
    .verdict { padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; line-height: 1.65; font-weight: 700; }
    .verdict.ok { background: #e8f6ee; color: var(--ok); border: 1px solid #b7e0c7; }
    .verdict.mid { background: #fff7e8; color: #9a6400; border: 1px solid #efd8a6; }
    .verdict.bad { background: #fceeee; color: var(--bad); border: 1px solid #efc2c2; }
    .report { white-space: pre-wrap; line-height: 1.75; }
    .hidden { display: none !important; }
    label.field { display: block; color: var(--muted); font-size: .82rem; margin: 0 0 6px; }
    input.line {
      width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 10px; font: inherit; background: #fff; color: var(--ink);
    }
    .grid { display: grid; gap: 12px; }
    @media (min-width: 560px) {
      .grid.two { grid-template-columns: 1.2fr .8fr; }
    }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home-link" href="../index.html">← 返回导航</a>
    <div class="brand"><i></i>分数除法习题学伴</div>
    <span class="tag">六年级数学 · 分数除法</span>
    <p class="desc">只练一个知识点：分数除法。手输入题目和学生答案，学伴当场算出正确答案，并判断对错。</p>

    <section class="panel">
      <div class="step">01 输入算式</div>
      <h2>写出题目和学生答案</h2>
      <p class="hint">分数用 4/7 这样写，除号用 ÷ 或 / 都可以。也可以一行写完：4/7 ÷ 3 = 12/7</p>
      <div class="grid two">
        <div>
          <label class="field" for="qLine">题目</label>
          <input class="line" id="qLine" type="text" placeholder="例如：4/7 ÷ 3" />
        </div>
        <div>
          <label class="field" for="aLine">学生答案</label>
          <input class="line" id="aLine" type="text" placeholder="例如：12/7" />
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="gradeBtn">批改</button>
        <button type="button" class="btn ghost" id="clearBtn">清空</button>
      </div>
    </section>

    <section class="panel hidden" id="resultPanel">
      <div class="step">02 批改结果</div>
      <h2>对错判断与掌握分析</h2>
      <div id="verdict" class="verdict"></div>
      <div id="report" class="report"></div>
    </section>
  </div>

  <script>
    const BANK = [
      { key: "3/5 ÷ 2/5", tip: "除以一个数等于乘它的倒数。", guide: ["找到除数 2/5。", "改成乘 5/2。", "约分得最简分数。"], drills: ["3/4 ÷ 1/2", "5/6 ÷ 2/3"] },
      { key: "3/4 ÷ 1/2", tip: "除以一个数等于乘它的倒数。", guide: ["1/2 的倒数是 2。", "3/4 × 2/1。", "约分成 3/2。"], drills: ["2/3 ÷ 1/4", "5/8 ÷ 1/2"] },
      { key: "1 ÷ 2/5", tip: "1 乘除数的倒数。", guide: ["2/5 的倒数是 5/2。", "1 × 5/2。", "结果是 5/2。"], drills: ["1 ÷ 3/4", "1 ÷ 1/8"] },
      { key: "2/3 ÷ 4", tip: "除以整数 4，等于乘 1/4。", guide: ["4 的倒数是 1/4。", "2/3 × 1/4。", "约分成 1/6。"], drills: ["3/5 ÷ 3", "5/6 ÷ 5"] },
      { key: "4/7 ÷ 3", tip: "除以整数 3，等于乘 1/3，不是把 3 乘到分子上。", guide: ["3 的倒数是 1/3。", "4/7 × 1/3。", "得到 4/21。"], drills: ["2/5 ÷ 3", "5/8 ÷ 4"] },
      { key: "5/6 ÷ 2/3", tip: "先写倒数再乘，能约分先约。", guide: ["2/3 的倒数是 3/2。", "5/6 × 3/2，6 和 3 先约分。", "得到 5/4。"], drills: ["4/9 ÷ 2/3", "7/8 ÷ 7/12"] },
      { key: "3 ÷ 3/4", tip: "整数除以分数 = 乘倒数。", guide: ["3/4 的倒数是 4/3。", "3 × 4/3。", "约分成 4。"], drills: ["2 ÷ 1/5", "6 ÷ 2/3"] }
    ];

    const el = {
      qLine: document.getElementById("qLine"),
      aLine: document.getElementById("aLine"),
      resultPanel: document.getElementById("resultPanel"),
      verdict: document.getElementById("verdict"),
      report: document.getElementById("report")
    };

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) { const t = a % b; a = b; b = t; }
      return a || 1;
    }

    function simp(n, d) {
      if (!d) return "";
      const g = gcd(n, d);
      n /= g; d /= g;
      if (d < 0) { n = -n; d = -d; }
      return d === 1 ? String(n) : n + "/" + d;
    }

    function parseFrac(s) {
      const raw = String(s || "").replace(/\s+/g, "").replace(/又/g, "+");
      const mixed = raw.match(/^(-?\d+)\+(\d+)\/(\d+)$/);
      if (mixed) {
        const whole = +mixed[1], n = +mixed[2], d = +mixed[3];
        if (!d) return null;
        return { n: whole * d + (whole < 0 ? -n : n), d };
      }
      const m = raw.match(/^(-?\d+)(?:\/(-?\d+))?$/);
      if (!m) return null;
      return { n: +m[1], d: m[2] ? +m[2] : 1 };
    }

    function showFrac(f) {
      if (!f) return "";
      return simp(f.n, f.d);
    }

    function sameFrac(a, b) {
      if (!a || !b || !a.d || !b.d) return false;
      return a.n * b.d === b.n * a.d;
    }

    function cleanExpr(s) {
      return String(s || "")
        .replace(/\s+/g, "")
        .replace(/[：]/g, ":")
        .replace(/[＝]/g, "=")
        .replace(/[÷:／]/g, "÷");
    }

    function parseInput(qText, aText) {
      let q = cleanExpr(qText);
      let stuRaw = String(aText || "").replace(/\s+/g, "");
      if (q.includes("=") && !stuRaw) {
        const parts = q.split("=");
        q = parts[0];
        stuRaw = parts.slice(1).join("=");
      }
      q = q.replace(/=.*$/, "");
      const m = q.match(/^(-?\d+(?:\/-?\d+)?)÷(-?\d+(?:\/-?\d+)?)$/);
      if (!m) return null;
      const left = parseFrac(m[1]);
      const right = parseFrac(m[2]);
      if (!left || !right || !right.n) return null;
      const leftShow = showFrac(left);
      const rightShow = showFrac(right);
      const answer = simp(left.n * right.d, left.d * right.n);
      const rec = simp(right.d, right.n);
      const stu = parseFrac(stuRaw.replace(/[÷／]/g, "/"));
      const key = leftShow + " ÷ " + rightShow;
      const tip = BANK.find((x) => x.key === key) || {
        tip: "除以一个数等于乘它的倒数。分数÷整数，要把整数写成倒数再乘。",
        guide: ["找出除数。", "写成乘除数的倒数。", "约分成最简分数。"],
        drills: ["2/5 ÷ 3", "5/8 ÷ 4"]
      };
      return {
        qShow: leftShow + " ÷ " + rightShow,
        leftShow,
        rightShow,
        rec,
        answer,
        stuShow: stuRaw ? (stu ? showFrac(stu) : stuRaw) : "",
        stu,
        ok: !!(stu && sameFrac(stu, parseFrac(answer))),
        tip: tip.tip,
        guide: tip.guide,
        drills: tip.drills
      };
    }

    function reportOf(p) {
      const judge = !p.stuShow ? "还没有填写学生答案" : (p.ok ? "正确" : "错误");
      const lines = [
        "【题目】" + p.qShow,
        "【学生答案】" + (p.stuShow || "未填写"),
        "【正确答案】" + p.answer,
        "【判断】学生答案" + judge,
        "",
        "【计算过程】",
        p.qShow + " = " + p.leftShow + " × " + p.rec + " = " + p.answer,
        "",
        "【分析】" + p.tip,
        "",
        "【订正引导】",
        "1. " + p.guide[0],
        "2. " + p.guide[1],
        "3. " + p.guide[2],
        "",
        "【巩固一下】",
        "1. " + p.drills[0],
        "2. " + p.drills[1]
      ];
      return lines.join("\n");
    }

    function grade() {
      const parsed = parseInput(el.qLine.value, el.aLine.value);
      if (!parsed) {
        el.resultPanel.classList.remove("hidden");
        el.verdict.className = "verdict mid";
        el.verdict.textContent = "请先写成分数除法算式，例如题目填 4/7 ÷ 3，学生答案填 12/7。";
        el.report.textContent = "";
        return;
      }
      if (!el.aLine.value.trim() && parsed.stuShow) el.aLine.value = parsed.stuShow;
      if (el.qLine.value.includes("=")) el.qLine.value = parsed.qShow;
      el.resultPanel.classList.remove("hidden");
      if (!parsed.stuShow) {
        el.verdict.className = "verdict mid";
        el.verdict.textContent = "题目已读出。请补上学生答案后再判断对错。正确答案是 " + parsed.answer + "。";
      } else if (parsed.ok) {
        el.verdict.className = "verdict ok";
        el.verdict.textContent = "判断：学生答案正确。正确答案是 " + parsed.answer + "。";
      } else {
        el.verdict.className = "verdict bad";
        el.verdict.textContent = "判断：学生答案错误。正确答案是 " + parsed.answer + "，学生写的是 " + parsed.stuShow + "。";
      }
      el.report.textContent = reportOf(parsed);
      el.resultPanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function clearAll() {
      el.qLine.value = "";
      el.aLine.value = "";
      el.resultPanel.classList.add("hidden");
      el.qLine.focus();
    }

    document.getElementById("gradeBtn").addEventListener("click", grade);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    [el.qLine, el.aLine].forEach((box) => {
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter") grade();
      });
    });
  </script>
</body>
</html>
